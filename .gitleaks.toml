# gitleaks config for Slab/atomicsite (used by the public-mirror publish gate and
# any local scan). Extends the default ruleset, then allowlists documentation/config
# PLACEHOLDERS and TEST FIXTURES. A real leaked credential would not carry these
# obvious markers, so it is still caught.
title = "slab"

[extend]
useDefault = true

[allowlist]
description = "Config placeholders + test fixtures use obvious markers, not real secrets"
# Test files never carry real secrets by policy; their JWT/e2e fixtures are
# deliberately fake. Allowlist the test paths plus the specific fixture strings.

# Generated frontend build output. scripts/ci.sh builds the frontend BEFORE the
# secret scan (a frontend that does not build is a server shipping a broken UI),
# and gitleaks detect --no-git walks the filesystem, so it would otherwise scan
# minified bundles. That is not a useful place to look for a leaked credential:
# nothing here is committed (git ls-files returns nothing for these paths), and a
# minified chunk trips the private-key rule on ordinary base64. It failed the
# slab CI run on 2026-07-28 for exactly that, twice, in two copies of the same
# generated bundle.
#
# A secret that genuinely reached a bundle came from a SOURCE file, and the
# source is still scanned.
paths = [
  '''(^|/)frontend/build/''',
  '''(^|/)frontend/\.svelte-kit/''',
  '''(^|/)frontend/dist/''',
  '''(^|/)frontend/node_modules/''',

  '''.*_test\.go''',
  '''.*\.spec\.ts''',
  '''.*/e2e/.*''',
  '''.*\.test\.ts''',
  # A deploy-target FORM: the "-----BEGIN OPENSSH PRIVATE KEY-----" string is the
  # input placeholder/hint (bind:value={rsyncKey}); the key is user input at
  # runtime, never a committed secret. gitleaks' private-key rule false-trips on
  # the bare PEM header.
  '''.*/deploy/TargetForm\.svelte''',
]
regexes = [
  '''changeme''',
  '''change[_-]?me''',
  '''your_[a-z0-9_]*''',
  '''base64_32_bytes_here''',
  '''min_16_char_org_key''',
  '''_from_vault''',
  '''EXAMPLE''',
  # Slab test fixtures (deliberately fake JWT/session secrets):
  '''test[-_]jwt[-_]secret''',
  '''e2e-jwt-secret-not-for-production''',
  '''this-is-a-strong-32-byte-secret-value-here''',
  '''secret-32-bytes(-x)+''',
  '''invitee-pw-[0-9]+''',
  '''DefaultJWTSecret''',
]
