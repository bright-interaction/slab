# Slab host-nginx security baseline.
#
# Drop this on whatever host fronts your Slab deployment so every
# response carries the headers Site Inspector / securityheaders.com look
# for to award an A+. Works for any deployment shape:
#
#   * Single root domain (typical):  example.com  + admin.example.com
#   * Subdomain-per-site (multi):    *.example.com (operator picks)
#   * Path-per-site:                 example.com/site-a, example.com/site-b
#
# The defaults below assume nothing about your hostname or directory
# layout. The Slab builder also writes a per-site nginx.conf with
# a tighter CSP tailored to each site's `allowed_scripts` list, when
# you `include` that file from your server block, those rules override
# the conservative CSP here.
#
# Install (CORRECT, DO NOT drop in /etc/nginx/conf.d/):
#     sudo mkdir -p /etc/nginx/snippets
#     sudo cp slab-headers.conf /etc/nginx/snippets/slab-headers.conf
#
# Then `include` it from EACH server{} block that fronts an Slab:
#     server {
#         server_name *.slab.example.com;
#         include /etc/nginx/snippets/slab-headers.conf;
#         ...
#     }
#     sudo nginx -t && sudo systemctl reload nginx
#
# Why NOT /etc/nginx/conf.d/: that loads at http{} scope, which means
# every server block on the host (including unrelated apps like a CRM,
# marketing site, or wiki) inherits this CSP, and most apps need
# `'unsafe-inline'` for hydration scripts that this conf forbids. We
# learned this the hard way 2026-05-01: shipping the conf in conf.d/
# white-screened brightcrm and the marketing site within seconds. The
# snippets-include pattern keeps the headers strictly scoped to
# Slab server blocks.
#
# To pick up the per-site builder output as well, add inside your
# server { } block (after any `map` that derives the site key):
#
#     include /var/slab/builds/<your-key>/nginx.conf;
#
# Replace `<your-key>` with whatever variable your nginx uses to identify
# the active site (`$host`, a `$mapped_slug`, etc.). Without that
# include, the safe defaults below apply to every request.
#
# add_header inherits into nested locations as long as no location
# declares its own add_header (in which case copy these in to that
# location too).

# Strict transport security: 2 years, includeSubDomains, preload.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Conservative CSP that works for any Slab tenant out of the
# box. `'self'` covers the same-origin cookie banner (/_ccb.<hash>.js)
# and the inline-config blob the builder emits in <head>. Tenants who
# add Google Analytics, Umami, Plausible, Stripe, cal.com, YouTube, etc.
# extend this via the admin's `allowed_scripts` list, the per-site
# nginx.conf the builder writes carries those extensions. To honour
# them, `include` the per-site file from your server block (see the
# header comment above).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy: turn off every powerful API a marketing / SaaS
# site never uses. Site Inspector A+ list. Override per-site only when
# the tenant runs an in-page video conference, AR demo, payments
# embed, etc.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;

# Cross-origin isolation. allow-popups so OAuth login flows still work.
# CORP same-origin so other origins can't pull resources without
# explicit consent. COEP off because most tenants embed YouTube /
# Stripe / cal.com which don't send CORP headers, turn it on per
# site only when none of those embeds are in play.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# COEP unsafe-none is the explicit "no embedder isolation" value. Modern
# browsers treat this as the default, but scanners (Site Inspector /
# securityheaders.com) expect the header to be set explicitly to grade
# A+. Tenants who run a fully same-origin site can flip to require-corp
# via a per-site override; the conservative default ships unsafe-none so
# YouTube / Stripe / cal.com / Loom embeds keep working.
add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

# Legacy headers scanners still grade for. Modern browsers ignore
# X-XSS-Protection (the reflective filter had bugs and was removed)
# but Site Inspector expects it set. X-Permitted-Cross-Domain-Policies
# locks down legacy Adobe Flash / Silverlight crossdomain.xml lookup,
# `none` is A+ and has zero downside on modern stacks.
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
