# Slab: OSS reference Docker Compose
#
# This file is the OSS-friendly example. It expects you to run from the
# slab/ directory only (no parent-context coupling to a sibling
# CookieProof checkout). The CookieProof widget is already embedded into
# the binary at compile time, so no extra build context is needed.
#
# This is the reference self-host Compose file. For a multi-tenant edge
# deployment you would add host bind-mounts (e.g. /srv/slab for the
# built-site output and /var/log/slab for per-site access logs) and
# put a TLS-terminating reverse proxy in front; this example stays minimal
# so a single-root deployment works out of the box.
#
# Quickstart:
#   cp .env.example .env       # fill in JWT_SECRET, ANALYTICS_SALT,
#                              # SLAB_PRIMARY_DOMAIN, ADMIN_PASSWORD
#   docker compose -f docker-compose.example.yml up --build

services:
  slab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slab
    restart: unless-stopped
    ports:
      # Public on the host. Put a TLS-terminating proxy (Caddy, nginx,
      # Traefik) in front for production.
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATA_DIR: /data
      SLAB_DEPLOYMENT_MODE: single
    volumes:
      # SQLite database, uploaded media, self-hosted woff2 fonts.
      - slab-data:/data
      # Built-site dist output. Mount this to whatever path your edge
      # serves from. Defaults to a named volume so first run "just works".
      - slab-dist:/srv/slab
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  slab-data:
  slab-dist:
