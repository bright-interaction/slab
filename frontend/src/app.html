<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Atomicsite</title>
		<script>
			(function () {
				try {
					var t = localStorage.getItem('atomicsite_theme');
					if (t === 'dark' || t === 'light') {
						document.documentElement.setAttribute('data-theme', t);
					}
				} catch (e) {}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!--
			Admin UI font preloads. Loads every curated family the Branding
			page offers so the right-side preview renders the chosen font for
			real (otherwise the browser silently falls back to system, and the
			preview lies). Used only by the admin app, never by the built sites.
		-->
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300..700&family=Manrope:wght@300..700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400..700&family=Lora:wght@400..700&family=Source+Serif+4:wght@300..700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
