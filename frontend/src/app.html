<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Slab</title>
		<script>
			(function () {
				try {
					var t = localStorage.getItem('slab_theme');
					if (t === 'dark' || t === 'light') {
						document.documentElement.setAttribute('data-theme', t);
					}
				} catch (e) {}
			})();
		</script>
		<!--
			Admin UI font preload. Loads every curated family the Branding
			page offers so the right-side preview renders the chosen font
			for real. Self-hosted under /fonts/* per the EU-sovereignty
			policy (no fonts.googleapis.com / fonts.gstatic.com at runtime).
		-->
		<link rel="preload" as="font" type="font/woff2" href="/fonts/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2" crossorigin />
		<link rel="stylesheet" href="/fonts/fonts.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
