# Atomic Site: OSS CI
#
# Fast feedback loop on every PR: vet + tests on the fair-code core build
# and a frontend build. The slower Playwright E2E suite lives in e2e.yml.
#
# Notes:
# - The analyticsdb package uses marcboeker/go-duckdb/v2 which requires
#   CGO and a C++ toolchain. ubuntu-latest already has build-essential.
# - Tests run with -race -count=1 to catch data races and avoid stale
#   cached results.
# - The enterprise (ee) cloud layer is held back and not published in this
#   repository, so the CI builds only the default fair-code core.

name: Atomicsite OSS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install C++ toolchain (DuckDB CGO)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: svelte-check (zero errors gate)
        working-directory: frontend
        run: bunx svelte-check --tsconfig ./tsconfig.json --threshold error

      - name: TypeScript noEmit
        working-directory: frontend
        run: bunx tsc --noEmit

  frontend-build:
    needs: [frontend-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build SvelteKit admin SPA
        working-directory: frontend
        run: bun run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: atomicsite-frontend-build
          path: frontend/build/
          retention-days: 7

  go-build:
    needs: [go-test, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install C++ toolchain (DuckDB CGO)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: atomicsite-frontend-build
          path: cmd/server/frontend/build/

      - name: Build Go binary (core)
        run: go build -o bin/atomicsite ./cmd/server

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: atomicsite-binaries
          path: |
            bin/atomicsite
          retention-days: 7

  quickstart-smoke:
    # Validates the README's "60-second quickstart" path: a fresh
    # checkout, no env vars, no DB. The binary should boot, seed the
    # admin user, and answer /api/health within 30s.
    needs: [go-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: atomicsite-binaries
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/atomicsite

      - name: Boot atomicsite
        run: |
          mkdir -p data
          ./bin/atomicsite > /tmp/atomicsite.log 2>&1 &
          echo $! > /tmp/atomicsite.pid

      - name: Wait for /api/health to respond
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health > /tmp/health.json; then
              echo "atomicsite up after ${i}s"
              cat /tmp/health.json
              # /api/mode is the OSS branding probe.
              curl -fsS http://127.0.0.1:8080/api/mode | grep -q '"mode":"single"'
              exit 0
            fi
            sleep 1
          done
          echo "atomicsite never came up. Logs:"
          cat /tmp/atomicsite.log
          exit 1

      - name: Stop atomicsite
        if: always()
        run: kill $(cat /tmp/atomicsite.pid) || true

  backup-verification:
    # Validates the `atomicsite backup-db` CLI by:
    #   1. Booting a server and seeding a row.
    #   2. Running VACUUM INTO via the backup-db verb.
    #   3. Booting a SECOND server against the restored snapshot.
    #   4. Verifying the row survived the round-trip + the schema_versions
    #      table is intact.
    #
    # Untested backups are not backups; this job locks the contract
    # so a regression in VACUUM INTO or schema-versioning surfaces
    # before customers find out.
    needs: [go-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: atomicsite-binaries
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/atomicsite

      - name: Boot first server + seed a row
        run: |
          mkdir -p /tmp/atomicsite-source/data
          (cd /tmp/atomicsite-source && \
            DATA_DIR=/tmp/atomicsite-source/data \
            $GITHUB_WORKSPACE/bin/atomicsite > /tmp/source.log 2>&1) &
          echo $! > /tmp/source.pid
          # Wait for boot.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then break; fi
            sleep 1
          done
          # Mint a marker row by hashing a known string into audit_log
          # via the admin login + sign-out-everywhere flow. Anything
          # that touches the DB works; we just need a verifiable artifact.
          COOKIE=$(curl -sS -i -X POST -H "Content-Type: application/json" \
            -d '{"email":"admin@atomicsite.dev","password":"changeme123"}' \
            http://127.0.0.1:8080/api/auth/login | \
            grep -i "set-cookie:" | head -1 | awk '{print $2}' | tr -d ';\r')
          curl -sS -X POST -H "Cookie: $COOKIE" \
            http://127.0.0.1:8080/api/auth/sign-out-everywhere > /dev/null
          # Force a checkpoint by stopping the server cleanly so WAL
          # gets folded back into the main DB before we VACUUM INTO.
          kill -INT $(cat /tmp/source.pid) || true
          wait $(cat /tmp/source.pid) 2>/dev/null || true

      - name: Run backup-db CLI
        run: |
          mkdir -p /tmp/atomicsite-backup
          DATA_DIR=/tmp/atomicsite-source/data \
            $GITHUB_WORKSPACE/bin/atomicsite backup-db \
            --output=/tmp/atomicsite-backup/snapshot.db
          ls -la /tmp/atomicsite-backup/snapshot.db
          test -s /tmp/atomicsite-backup/snapshot.db

      - name: Restore snapshot into a second data dir + boot
        run: |
          mkdir -p /tmp/atomicsite-restored/data
          cp /tmp/atomicsite-backup/snapshot.db /tmp/atomicsite-restored/data/atomicsite.db
          (cd /tmp/atomicsite-restored && \
            DATA_DIR=/tmp/atomicsite-restored/data \
            PORT=8090 \
            BASE_URL=http://localhost:8090 \
            $GITHUB_WORKSPACE/bin/atomicsite > /tmp/restored.log 2>&1) &
          echo $! > /tmp/restored.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/health >/dev/null; then break; fi
            sleep 1
          done

      - name: Verify the seeded admin still authenticates against the restore
        run: |
          # If the round-trip was clean, the admin password from the
          # SOURCE server still works on the RESTORED server. Failure
          # here means the snapshot dropped the users row, the
          # password_hash got mangled, or the schema is divergent.
          COOKIE=$(curl -sS -i -X POST -H "Content-Type: application/json" \
            -d '{"email":"admin@atomicsite.dev","password":"changeme123"}' \
            http://127.0.0.1:8090/api/auth/login | \
            grep -i "set-cookie:" | head -1)
          if [ -z "$COOKIE" ]; then
            echo "ERROR: login against restored snapshot failed"
            cat /tmp/restored.log
            exit 1
          fi
          echo "Restore verified: admin login round-tripped"

      - name: Verify schema_versions table survives
        run: |
          # The schema_versions row exists on every healthy boot
          # (cmd/server/main.go records it). Its survival in the
          # snapshot proves the DDL applied cleanly.
          curl -fsS http://127.0.0.1:8090/api/health | grep -q '"sqlite":"ok"'

      - name: Stop both servers
        if: always()
        run: |
          kill $(cat /tmp/restored.pid) 2>/dev/null || true
          kill $(cat /tmp/source.pid) 2>/dev/null || true
